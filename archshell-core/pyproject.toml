[project]
name = "archshell"
version = "0.1.0"
description = "ArchShell core: domain, engine, and CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jinja2==3.1.6", "pyyaml==6.0.3"]

[project.scripts]
archshell-engine = "archshell.engine.cli:main"
archshell = "archshell.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
