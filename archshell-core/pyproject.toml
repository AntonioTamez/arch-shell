[project]
name = "archshell"
version = "0.1.0"
description = "ArchShell core: domain, engine, and CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jinja2==3.1.6", "jsonschema==4.26.0", "pyyaml==6.0.3"]

[project.scripts]
archshell-engine = "archshell.engine.cli:main"
archshell = "archshell.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
# `schemas/` holds the core JSON Schemas, read at runtime; it ships as data
# beside the `archshell` package (a namespace root with no `__init__.py`).
module-name = ["archshell", "schemas"]
namespace = true
