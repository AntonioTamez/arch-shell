  flow.probe.confirm.decline: "Rechazar"
  flow.probe.instruct: "Prueba: no hace falta ningún cambio; acusa recibo de esta instrucción."
  flow.probe.done: "Prueba terminada: se intercambiaron todos los tipos de acción."
  flow.probe_report.report: "Informe de la prueba: el protocolo se detuvo con una acción de informe."
  error.no_pending_action: "no hay ninguna acción pendiente que enviar"
  error.submit_schema: "el esquema del mensaje submit debe ser {schema}"
