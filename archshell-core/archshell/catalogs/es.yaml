# Spanish message catalog for the developer-facing texts of `next`/`submit`.
# The key set, and the {placeholder} names in each template, mirror en.yaml
# for parity. Errors raised before `--lang` is read, and hook errors, always
# render in English.
schema: "archshell/catalog/v1"
lang: "es"
messages:
