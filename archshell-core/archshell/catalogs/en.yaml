# English message catalog for the developer-facing texts of `next`/`submit`.
# The key set, and the {placeholder} names in each template, mirror es.yaml
# for parity. Errors raised before `--lang` is read, and hook errors, always
# render in English.
schema: "archshell/catalog/v1"
lang: "en"
messages:
  flow.probe.ask.question: "Probe: is the ArchShell action protocol reaching you?"
  flow.probe.ask.header: "Probe"
  flow.probe.ask.yes: "Yes"
  flow.probe.ask.no: "No"
  flow.probe.confirm.question: "Probe: confirm to continue the protocol probe."
  flow.probe.confirm.header: "Probe"
  flow.probe.confirm.confirm: "Confirm"
  flow.probe.confirm.decline: "Decline"
  flow.probe.instruct: "Probe: no change is needed; acknowledge this instruction."
  flow.probe.done: "Probe finished: every action type was exchanged."
  flow.probe_report.report: "Probe report: the protocol stopped with a report action."
  flow.bootstrap.ask.question: "What are you building? Describe the system and its main business areas in your own words, or pick an example."
  flow.bootstrap.ask.header: "Request"
  flow.bootstrap.ask.example_modules: "A clinic app for appointments, patients, and billing"
  flow.bootstrap.ask.example_single: "A single-purpose URL shortener"
  flow.bootstrap.confirm.question: "Proposed architecture: {patterns}, with the modules {modules}. Accept it and write the charter?"
  flow.bootstrap.confirm.header: "Proposal"
  flow.bootstrap.confirm.accept: "Accept"
  flow.bootstrap.confirm.decline: "Decline"
  flow.bootstrap.done: "Charter written: .archshell/charter/base.yaml and architecture.yaml record {patterns}."
  flow.bootstrap.declined: "Proposal declined: nothing was written."
  error.no_pending_action: "there is no pending action to submit"
  error.submit_schema: "submit message schema must be {schema}"
  error.submit_unknown_fields: "submit message has unknown fields"
  error.field_not_string: "{field} must be a string"
  error.field_not_integer: "{field} must be an integer"
  error.field_not_object: "{field} must be an object"
  error.unknown_feature: "no workflow for feature: {feature}"
  error.stale_action: "submission does not match the pending action"
  error.nonce_mismatch: "{type} result carries a wrong nonce"
  error.invalid_source: "{type} result must come from the host's question UI"
  error.invalid_output: "llm_task result does not match {output_schema} and the retry limit ({max_retries}) is used up"
  error.stdin_not_json: "stdin is not a UTF-8 JSON message: {error}"
  error.stdin_not_object: "stdin message must be a JSON object"
  error.expected_feature: "expected --feature <slug>"
  error.unexpected_arguments: "unexpected arguments"
  error.invalid_lang: "--lang must be one of: {languages}"
  error.invalid_feature_slug: "feature must be a kebab-case slug of at most {max_length} characters"
  error.feature_mismatch: "submit message feature does not match --feature"
  error.invalid_config: "{config} is invalid"
  error.hook_arguments: "{command} takes only {options}, each once with a value"
  error.unknown_host: "unknown host: {host}"
  error.hook_payload: "{error}"
  error.no_command: "no command given"
  error.unknown_command: "unknown command: {command}"
  error.locked: "another engine invocation holds this feature's lock"
  error.state_conflict: "state changed concurrently: {error}"
  error.invalid_state: "the feature's state file is unreadable"
  error.internal: "unexpected engine failure"
  error.host_render: "host render failed"
  error.answer_not_text: "ask result answer must be non-blank text"
  error.confirmed_not_boolean: "confirm result confirmed must be true or false"
  error.invalid_feature: "the feature is missing, not a valid slug, or not the submit's feature"
  error.invalid_arguments: "the command arguments are invalid"
  error.invalid_message: "the message is not a valid protocol message"
  error.internal_error: "unexpected engine failure"
  error.extension_error: "extension {entry_point} of {distribution} was refused"
  error.incompatible_extension: "extension {entry_point} of {distribution} does not implement the contract this core supports"
  error.duplicate_language: "language {language} is claimed by more than one language pack"
  error.bootstrap_interrupted: "an earlier bootstrap write was interrupted ({journal} is present); nothing was written"
  error.language_pack_missing: "no language pack is installed (entry-point group {group}); nothing was written"
