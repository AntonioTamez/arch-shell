[project]
name = "archshell-dotnet"
version = "0.1.0"
description = "ArchShell language pack for .NET / C#."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["archshell"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
archshell = { workspace = true }
