name: ci

on:
  push:
  pull_request:
  # The release workflow runs this same build on the tagged commit first.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: LF in the working tree (.gitattributes, any core.autocrlf)
        run: |
          crlf="$(git ls-files --eol | grep 'w/crlf' || true)"
          if [ -n "$crlf" ]; then
            echo "tracked files checked out with CRLF:"
            echo "$crlf"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: uv sync
        run: uv sync --locked

      - name: lint imports (package boundaries, AD-1 / AD-4)
        run: uv run lint-imports --no-cache

      - name: conformance (Claude Code plugin, language packs)
        run: uv run python -m pytest -v archshell-core/conformance

      - name: golden byte check (rendered sha256 must match the committed manifest)
        run: uv run pytest -v archshell-core/tests/test_golden.py

      - name: pytest
        run: uv run pytest

      - name: engine smoke (console script)
        run: |
          out="$(echo '{}' | uv run archshell-engine next --feature probe)"
          echo "$out"
          uv run python -c 'import json, sys; m = json.loads(sys.argv[1]); assert (m["schema"], m["type"], m["revision"]) == ("archshell/action/v1", "llm_task", 1), m' "$out"
          uv run archshell --version

      - name: no-op flow (scripted Claude Code host, all six action types, hooks, records, both catalogs)
        run: |
          uv run python -m pytest -v archshell-core/tests/test_no_op_flow.py
          uv run python -m pytest -v archshell-core/conformance/test_plugin_conformance.py -k engine_interface

      - name: bootstrap flow (scripted host, request to charter and architecture.yaml, golden bytes)
        run: uv run python -m pytest -v archshell-core/tests/test_bootstrap_flow.py archshell-core/tests/test_scoring.py archshell-core/tests/test_error_registry.py

      - name: build analyzer
        run: dotnet build archshell-dotnet/analyzer --configuration Release

      - name: pack analyzer
        run: dotnet pack archshell-dotnet/analyzer --configuration Release --no-build

      - name: run analyzer
        run: dotnet run --no-build --configuration Release --project archshell-dotnet/analyzer
