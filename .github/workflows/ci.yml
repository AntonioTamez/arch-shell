name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: uv sync
        run: uv sync --locked

      - name: golden byte check (rendered sha256 must match the committed manifest)
        run: uv run pytest -v archshell-core/tests/test_golden.py

      - name: pytest
        run: uv run pytest

      - name: engine smoke (console script)
        run: |
          out="$(echo '{}' | uv run archshell-engine next --feature probe)"
          echo "$out"
          uv run python -c 'import json, sys; m = json.loads(sys.argv[1]); assert (m["schema"], m["type"], m["revision"]) == ("archshell/action/v1", "llm_task", 1), m' "$out"
          uv run archshell --version

      - name: build analyzer
        run: dotnet build archshell-dotnet/analyzer --configuration Release

      - name: pack analyzer
        run: dotnet pack archshell-dotnet/analyzer --configuration Release --no-build

      - name: run analyzer
        run: dotnet run --no-build --configuration Release --project archshell-dotnet/analyzer
