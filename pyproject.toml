[project]
name = "arch-shell-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["archshell", "archshell-dotnet"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["archshell-core", "archshell-dotnet"]

[tool.uv.sources]
archshell = { workspace = true }
archshell-dotnet = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["archshell-core/tests", "archshell-dotnet/tests"]
